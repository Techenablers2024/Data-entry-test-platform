services:
  postgres:
    image: postgres:16-alpine
    container_name: dataentry_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: dataentry
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dataentry_backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ./backend/.env
    environment:
      DB_DSN: "host=postgres user=postgres password=secret dbname=dataentry port=5432 sslmode=disable TimeZone=Asia/Kolkata"
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
